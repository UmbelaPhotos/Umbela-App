name: umbela_app
description: "Umbela: private, self-hosted photo vault client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  async: ^2.13.1
  connectrpc: ^2.0.1
  cryptography: ^2.9.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.9.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  lucide_icons_flutter: ^4.0.1
  mobile_scanner: ^7.4.2
  protobuf: ^6.1.0
  share_plus: ^13.3.1
  tor: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#EBF3F9"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 12
